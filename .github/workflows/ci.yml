name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 06:00 UTC. Drives the `spec-drift` job only — see its comment
    # for why that check is not part of the per-PR matrix.
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI never makes commits, but `npm install` triggers the `prepare` script
# which installs husky hooks; HUSKY=0 keeps the hook scripts inert if any
# transient git operation runs (e.g. lint-staged backups).
env:
  HUSKY: 0

permissions:
  contents: read

jobs:
  verify:
    name: lint • typecheck • test • build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Closes the `spec → types` half of the contract chain. The other half
      # (`backend → spec`) is the `spec-drift` job below.
      - name: Verify generated types are in sync with the OpenAPI spec
        run: |
          npm run openapi:types
          git diff --exit-code -- src/types/generated/ \
            || (echo "::error::Committed generated types differ from openapi/*.json. Run 'npm run openapi:types' and commit the result." && exit 1)

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Closes the `backend → spec` half of the contract chain.
  #
  # `verify` proves the generated types match the committed spec. It cannot
  # prove the committed spec still matches the backend — and it didn't: the
  # spec went ~3 months stale, during which `calculate-amount` changed from GET
  # to POST, `CaptureRequestDto.amount` became `captureAmount`, list responses
  # moved from `total` to `pageInfo`, and a strict-JSON-binding change upstream
  # turned every stale field name into a hard 400.
  #
  # Deliberately NOT part of the PR matrix: a backend deploy would then redden
  # unrelated pull requests, which is somebody else's change and not something
  # the PR author can fix. Scheduled + manual instead.
  #
  # It opens a pull request rather than filing an issue. The issue version was
  # correct and useless: it detected three real drifts on the day they happened
  # and each sat untouched for days — 24, then 4 — because a red scheduled run
  # notifies an inbox nobody owns, while a PR lands in a review queue that
  # somebody already works through. The job itself stays green when it opens a
  # PR, because a recurring red run is the thing people learn to ignore.
  spec-drift:
    name: OpenAPI spec drift (backend → spec)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Built before touching the spec so the published type surface can be
      # diffed afterwards. That diff is what decides whether the resync needs a
      # changeset, and getting it wrong means either a pointless release or
      # consumers left on types that no longer match the API.
      - name: Baseline the published type surface
        run: |
          npm run --silent build
          cp dist/index.d.ts /tmp/dts-before.d.ts

      # The URL is a secret rather than a literal: this repository is public and
      # the swagger document is served from a non-production host that is not
      # part of the published surface. Forks without the secret skip cleanly
      # instead of failing.
      - name: Refresh the spec from the live document
        id: drift
        env:
          ISV_API_SPEC_URL: ${{ secrets.ISV_API_SPEC_URL }}
        run: |
          set -o pipefail
          if [ -z "${ISV_API_SPEC_URL}" ]; then
            echo "::warning::ISV_API_SPEC_URL is not configured; drift check skipped."
            echo 'status=skipped' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run --silent openapi:fetch 2>&1 | tee drift.log
          if git diff --quiet -- openapi/; then
            echo 'status=clean' >> "$GITHUB_OUTPUT"
          else
            echo 'status=drift' >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate types
        if: steps.drift.outputs.status == 'drift'
        run: npm run --silent openapi:types

      # Runs lint, typecheck, tests and build. A failure here is signal, not
      # noise: the compile errors ARE the contract changes. The PR is still
      # opened, flagged, so the diff is available to whoever picks it up.
      - name: Verify against the refreshed contract
        id: verify
        if: steps.drift.outputs.status == 'drift'
        continue-on-error: true
        run: npm run verify

      # Only meaningful when verify succeeded: `npm run verify` builds last, so
      # a failure anywhere before it leaves dist/ holding the baseline build and
      # the comparison would report "unchanged" for a surface nobody rebuilt.
      - name: Did the published type surface change?
        id: dts
        if: steps.drift.outputs.status == 'drift'
        run: |
          if [ '${{ steps.verify.outcome }}' != 'success' ]; then
            echo 'changed=unknown' >> "$GITHUB_OUTPUT"
          elif diff -q /tmp/dts-before.d.ts dist/index.d.ts >/dev/null 2>&1; then
            echo 'changed=no' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=yes' >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the resync pull request
        if: steps.drift.outputs.status == 'drift'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERIFY: ${{ steps.verify.outcome }}
          DTS_CHANGED: ${{ steps.dts.outputs.changed }}
        run: |
          set -euo pipefail
          BRANCH=chore/openapi-resync

          if [ "$VERIFY" = 'success' ]; then
            TITLE='chore(openapi): resync the spec with the live backend'
            VERDICT='`npm run verify` passes — lint, typecheck, tests and build, with no source changes.'
          else
            TITLE='chore(openapi): resync the spec — NEEDS WORK, verify fails'
            VERDICT='**`npm run verify` fails.** The backend changed something this SDK depends on; the errors in the run log are the contract changes and need fixing by hand before this merges.'
          fi

          case "$DTS_CHANGED" in
            yes) CHANGESET='`dist/index.d.ts` **changed**, so this alters the published type surface and needs a changeset before it reaches consumers.' ;;
            no)  CHANGESET='`dist/index.d.ts` is unchanged, so nothing reaches the published surface and no changeset is needed.' ;;
            *)   CHANGESET='Whether the published type surface changed could not be determined, because the build never ran. Check it by hand once verify passes.' ;;
          esac

          BODY=$(
            printf 'Opened automatically: the committed spec fell behind the live ISV API v2 document.\n\n'
            printf 'Run: %s\n\n' "$RUN_URL"
            printf '## What the refresh reported\n\n```\n'
            cat drift.log
            printf '\n```\n\n## Verification\n\n%s\n\n%s\n\n' "$VERDICT" "$CHANGESET"
            printf '## Note on checks\n\n'
            printf 'Pull requests opened with `GITHUB_TOKEN` do not trigger workflows, so this PR will show no checks of its own. '
            printf 'That is why verification runs inside the drift job and is reported above rather than left to CI.\n'
          )

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          # The branch is reused so repeated runs update one PR instead of
          # spawning a new one per day. That means force-pushing, which would
          # destroy a human's commits if somebody is fixing a verify failure on
          # it — so only push when the branch is untouched or the bot wrote the
          # last commit on it.
          SAFE=yes
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$BRANCH"
            LAST_AUTHOR=$(git log -1 --format='%ae' FETCH_HEAD)
            case "$LAST_AUTHOR" in
              *github-actions*) ;;
              *) SAFE=no ;;
            esac
          fi

          if [ "$SAFE" = 'no' ]; then
            echo "::warning::$BRANCH carries commits from $LAST_AUTHOR; leaving it alone."
            if [ -n "$EXISTING" ]; then
              gh pr comment "$EXISTING" --body "The scheduled drift job ran again and the spec is still behind. This branch has human commits on it, so it was left untouched. Latest report: $RUN_URL"
            fi
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add openapi/ src/types/generated/
          git commit -m "chore(openapi): resync the spec with the live backend" -m "Opened automatically by the scheduled drift job. See $RUN_URL"
          git push --force origin "$BRANCH"

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "Updated PR #$EXISTING."
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi

      - name: Summarise
        if: always()
        run: |
          {
            echo '### OpenAPI spec drift'
            echo
            echo "Result: **${{ steps.drift.outputs.status }}**"
            if [ '${{ steps.drift.outputs.status }}' = 'drift' ]; then
              echo
              echo "verify: **${{ steps.verify.outcome }}** · published types changed: **${{ steps.dts.outputs.changed }}**"
              echo
              echo 'A resync pull request has been opened or updated.'
            fi
            if [ -f drift.log ]; then
              echo
              echo '```'
              cat drift.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
